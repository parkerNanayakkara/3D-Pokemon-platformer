<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pokémon Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* UI Layering */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }
        
        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 10px; height: 10px; background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.5); display: none;
        }

        /* Start Screen */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; pointer-events: auto; z-index: 20;
        }

        /* Dialog Box */
        #dialog-box {
            position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 800px; background: rgba(0, 0, 0, 0.8);
            border: 4px solid #fff; border-radius: 12px; padding: 20px; color: white;
            font-size: 1.2rem; display: none; text-shadow: 2px 2px 0 #000;
        }

        /* Location Label */
        #location-label {
            position: absolute; bottom: 20px; right: 20px; background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid #4ade80; padding: 10px 20px; color: white;
            font-size: 1.5rem; font-weight: bold; border-radius: 4px; transition: opacity 0.5s;
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* Battle UI */
        #battle-ui {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; pointer-events: auto;
        }
        .hp-box {
            position: absolute; background: rgba(255, 255, 255, 0.9); border: 4px solid #333;
            border-radius: 12px; padding: 15px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #enemy-hp-box { top: 10%; left: 10%; }
        #player-hp-box { bottom: 25%; right: 10%; }
        .hp-bar-container { width: 100%; height: 15px; background: #ccc; border-radius: 8px; overflow: hidden; margin-top: 8px; border: 2px solid #555; }
        .hp-bar { height: 100%; background: #4ade80; width: 100%; transition: width 0.3s ease-in-out; }
        
        #battle-menu {
            position: absolute; bottom: 5%; right: 10%; width: 300px; display: grid;
            grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .battle-btn {
            background: #f8fafc; border: 4px solid #334155; padding: 15px; font-weight: bold;
            font-size: 1.1rem; border-radius: 8px; cursor: pointer; text-transform: uppercase;
            transition: transform 0.1s, background 0.2s;
        }
        .battle-btn:hover { background: #e2e8f0; transform: scale(1.05); }
        .battle-btn:active { transform: scale(0.95); }

        /* Screen Flash for encounters */
        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.1s;
        }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div id="start-screen">
            <h1 class="text-6xl font-bold mb-8 text-yellow-400 drop-shadow-lg" style="text-shadow: 4px 4px 0 #3b4cca;">POKÉMON 3D ADVENTURE</h1>
            <p class="text-xl mb-8 max-w-2xl text-center leading-relaxed">
                Click to enter Pallet Town.<br><br>
                <b>Controls:</b> WASD to move, Mouse to look around.<br>
                Look at a Poké Ball and click to choose your starter.<br>
                Walk into tall grass to encounter wild Pokémon. Find portals to travel to Alola and Galar!
            </p>
            <button id="btn-start" class="px-8 py-4 bg-red-500 hover:bg-red-600 border-4 border-white rounded-xl text-2xl font-bold transition transform hover:scale-110 pointer-events-auto">
                CLICK TO START
            </button>
        </div>

        <div id="crosshair"></div>
        <div id="location-label">Pallet Town</div>
        <div id="dialog-box">...</div>

        <div id="battle-ui">
            <div id="enemy-hp-box" class="hp-box">
                <h2 id="enemy-name" class="text-xl font-bold uppercase text-gray-800">Wild Pidgey</h2>
                <div class="hp-bar-container"><div id="enemy-hp-bar" class="hp-bar"></div></div>
            </div>
            
            <div id="player-hp-box" class="hp-box">
                <h2 id="player-name" class="text-xl font-bold uppercase text-gray-800">Bulbasaur</h2>
                <div class="hp-bar-container"><div id="player-hp-bar" class="hp-bar"></div></div>
            </div>

            <div id="battle-menu">
                <button class="battle-btn" onclick="battleAction('fight')">FIGHT</button>
                <button class="battle-btn" onclick="battleAction('catch')">CATCH</button>
                <button class="battle-btn" onclick="battleAction('run')">RUN</button>
            </div>
        </div>

        <div id="flash-overlay"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const GAME_STATES = { INTRO: 0, EXPLORATION: 1, BATTLE: 2 };
        let currentState = GAME_STATES.INTRO;
        let currentLocation = "Pallet Town";

        // Three.js Core
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Default sky blue
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // Realistic Tone Mapping Requirement
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 500;
        dirLight.shadow.camera.left = -100;
        dirLight.shadow.camera.right = 100;
        dirLight.shadow.camera.top = 100;
        dirLight.shadow.camera.bottom = -100;
        scene.add(dirLight);

        // Controls
        const controls = new PointerLockControls(camera, document.body);
        
        // Movement Variables
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false; let moveBackward = false;
        let moveLeft = false; let moveRight = false;
        let prevTime = performance.now();
        const movementSpeed = 40.0;

        // Game Entities
        let playerStarter = null;
        let followerMesh = null;
        let encounterZones = [];
        let portals = [];
        const interactables = []; // For Raycasting (Pokeballs)
        
        // Battle Variables
        let battleTarget = null;
        let preBattlePosition = new THREE.Vector3();
        let preBattleRotation = new THREE.Euler();
        let enemyMaxHP = 100; let enemyCurrentHP = 100;
        let playerMaxHP = 100; let playerCurrentHP = 100;
        let battleTurn = 'player'; // 'player' or 'enemy'

        // UI Elements
        const ui = {
            start: document.getElementById('start-screen'),
            btnStart: document.getElementById('btn-start'),
            crosshair: document.getElementById('crosshair'),
            dialog: document.getElementById('dialog-box'),
            location: document.getElementById('location-label'),
            battle: document.getElementById('battle-ui'),
            flash: document.getElementById('flash-overlay'),
            enemyName: document.getElementById('enemy-name'),
            playerName: document.getElementById('player-name'),
            enemyHP: document.getElementById('enemy-hp-bar'),
            playerHP: document.getElementById('player-hp-bar')
        };

        // We use basic primitives to simulate Pokémon without external assets.
        
        const materials = {
            red: new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.7 }),
            white: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }),
            black: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 }),
            wood: new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.9 }),
            grass: new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 1.0 }),
            oak: new THREE.MeshStandardMaterial({ color: 0xffdcb1, roughness: 0.5 }), // Skin
            labCoat: new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.8 }),
        };

        function createPokeball(userData) {
            const group = new THREE.Group();
            
            // Top half (Red)
            const topGeo = new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const topMesh = new THREE.Mesh(topGeo, materials.red);
            topMesh.castShadow = true;
            group.add(topMesh);

            // Bottom half (White)
            const botGeo = new THREE.SphereGeometry(0.5, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
            const botMesh = new THREE.Mesh(botGeo, materials.white);
            botMesh.castShadow = true;
            group.add(botMesh);

            // Center Band (Black)
            const bandGeo = new THREE.TorusGeometry(0.5, 0.05, 16, 32);
            const bandMesh = new THREE.Mesh(bandGeo, materials.black);
            bandMesh.rotation.x = Math.PI / 2;
            group.add(bandMesh);

            // Button (White)
            const btnGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.1, 16);
            const btnMesh = new THREE.Mesh(btnGeo, materials.white);
            btnMesh.rotation.x = Math.PI / 2;
            btnMesh.position.z = 0.5;
            group.add(btnMesh);

            // Invisible hit box for raycasting
            const hitGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const hitMat = new THREE.MeshBasicMaterial({ visible: false });
            const hitMesh = new THREE.Mesh(hitGeo, hitMat);
            hitMesh.userData = userData;
            group.add(hitMesh);
            interactables.push(hitMesh);

            return group;
        }

        function createPokemon(type) {
            const group = new THREE.Group();
            let bodyMat, featureMat, bodyGeo;

            switch(type.toLowerCase()) {
                case 'bulbasaur':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0x45b69c }); // Teal body
                    featureMat = new THREE.MeshStandardMaterial({ color: 0x78c850 }); // Green bulb
                    bodyGeo = new THREE.BoxGeometry(1, 0.8, 1);
                    const bulbGeo = new THREE.SphereGeometry(0.6, 16, 16);
                    const bulb = new THREE.Mesh(bulbGeo, featureMat);
                    bulb.position.y = 0.6;
                    bulb.position.z = -0.2;
                    bulb.castShadow = true;
                    group.add(bulb);
                    break;
                case 'charmander':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0xf08030 }); // Orange body
                    featureMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 }); // Flame tail
                    bodyGeo = new THREE.CylinderGeometry(0.5, 0.6, 1.2, 16);
                    const tailGeo = new THREE.ConeGeometry(0.2, 0.6, 16);
                    const tail = new THREE.Mesh(tailGeo, featureMat);
                    tail.position.set(0, -0.2, -0.6);
                    tail.rotation.x = -Math.PI / 4;
                    group.add(tail);
                    break;
                case 'squirtle':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0x6890f0 }); // Blue body
                    featureMat = new THREE.MeshStandardMaterial({ color: 0xa8a878 }); // Brown shell
                    bodyGeo = new THREE.BoxGeometry(0.9, 1.1, 0.9);
                    const shellGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.4, 16);
                    const shell = new THREE.Mesh(shellGeo, featureMat);
                    shell.rotation.x = Math.PI / 2;
                    shell.position.z = -0.5;
                    group.add(shell);
                    break;
                case 'pidgey':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0xa890f0 }); // Brownish
                    featureMat = new THREE.MeshStandardMaterial({ color: 0xf8d030 }); // Yellow beak
                    bodyGeo = new THREE.SphereGeometry(0.6, 16, 16);
                    const beakGeo = new THREE.ConeGeometry(0.2, 0.4, 16);
                    const beak = new THREE.Mesh(beakGeo, featureMat);
                    beak.rotation.x = Math.PI / 2;
                    beak.position.set(0, 0, 0.6);
                    group.add(beak);
                    break;
                case 'rattata':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0xa8a878 }); // Purple/grey
                    bodyGeo = new THREE.BoxGeometry(0.8, 0.6, 1.2);
                    break;
                case 'pikachu':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0xf8d030 }); // Yellow
                    featureMat = new THREE.MeshStandardMaterial({ color: 0x000000 }); // Black ear tips
                    bodyGeo = new THREE.BoxGeometry(0.8, 1, 0.8);
                    const earGeo = new THREE.ConeGeometry(0.15, 0.6, 16);
                    const ear1 = new THREE.Mesh(earGeo, bodyMat);
                    ear1.position.set(-0.3, 0.8, 0);
                    ear1.rotation.z = Math.PI / 6;
                    const ear2 = ear1.clone();
                    ear2.position.set(0.3, 0.8, 0);
                    ear2.rotation.z = -Math.PI / 6;
                    group.add(ear1); group.add(ear2);
                    break;
                case 'alolan vulpix':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff }); // White
                    featureMat = new THREE.MeshStandardMaterial({ color: 0xccffff }); // Icy blue
                    bodyGeo = new THREE.BoxGeometry(0.8, 0.9, 0.8);
                    const hairGeo = new THREE.SphereGeometry(0.4, 16, 16);
                    const hair = new THREE.Mesh(hairGeo, featureMat);
                    hair.position.y = 0.6;
                    group.add(hair);
                    break;
                case 'galarian slowpoke':
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0xf85888 }); // Pink
                    featureMat = new THREE.MeshStandardMaterial({ color: 0xf8d030 }); // Yellow head
                    bodyGeo = new THREE.BoxGeometry(1.2, 0.7, 1.5);
                    const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
                    const head = new THREE.Mesh(headGeo, featureMat);
                    head.position.set(0, 0.5, 0.8);
                    group.add(head);
                    break;
                default:
                    bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                    bodyGeo = new THREE.BoxGeometry(1, 1, 1);
            }

            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            body.position.y = 0.5; // Lift above ground
            group.add(body);
            
            // Add some bounce animation data
            group.userData = { initialY: group.position.y, type: type };
            return group;
        }

        function createProfessorOak() {
            const group = new THREE.Group();
            
            // Body (Lab Coat)
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.6, 2, 16);
            const body = new THREE.Mesh(bodyGeo, materials.labCoat);
            body.position.y = 1;
            body.castShadow = true;
            group.add(body);

            // Head
            const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const head = new THREE.Mesh(headGeo, materials.oak);
            head.position.y = 2.4;
            head.castShadow = true;
            group.add(head);

            return group;
        }

        function createEnvironment() {
            
            // 1. Global Ground (Very large, base green)
            const groundGeo = new THREE.PlaneGeometry(3000, 3000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55, roughness: 1.0 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // --- PALLET TOWN (Origin: 0, 0, 0) ---
            
            // Professor Oak's Lab (Simple Box)
            const labGeo = new THREE.BoxGeometry(10, 5, 8);
            const labMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc }); // Beige
            const lab = new THREE.Mesh(labGeo, labMat);
            lab.position.set(0, 2.5, -10);
            lab.castShadow = true; lab.receiveShadow = true;
            scene.add(lab);

            // Oak's Table
            const tableGeo = new THREE.BoxGeometry(4, 1, 2);
            const table = new THREE.Mesh(tableGeo, materials.wood);
            table.position.set(0, 0.5, -4);
            table.castShadow = true; table.receiveShadow = true;
            scene.add(table);

            // 3 Starter Pokeballs on table
            const pb1 = createPokeball({ type: 'starter', pokemon: 'Bulbasaur' });
            pb1.position.set(-1.2, 1.5, -4);
            scene.add(pb1);

            const pb2 = createPokeball({ type: 'starter', pokemon: 'Charmander' });
            pb2.position.set(0, 1.5, -4);
            scene.add(pb2);

            const pb3 = createPokeball({ type: 'starter', pokemon: 'Squirtle' });
            pb3.position.set(1.2, 1.5, -4);
            scene.add(pb3);

            // Professor Oak
            const oak = createProfessorOak();
            oak.position.set(0, 0, -6);
            scene.add(oak);

            // Route 1 Path
            const pathGeo = new THREE.PlaneGeometry(6, 100);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0xc2b280 }); // Dirt
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.set(0, 0.01, 45); // Extends positive Z
            path.receiveShadow = true;
            scene.add(path);

            // Tall Grass on Route 1 (Encounter Zones)
            createTallGrassZone(-10, 10, 20, 40, "Route 1", ['Pidgey', 'Rattata']);
            createTallGrassZone(-15, -5, 50, 80, "Route 1", ['Pikachu', 'Pidgey']);
            createTallGrassZone(5, 15, 60, 90, "Route 1", ['Rattata', 'Pikachu']);

            // --- ALOLA REGION (Origin: 1000, 0, 0) ---
            const alolaBaseGeo = new THREE.PlaneGeometry(100, 100);
            const alolaBaseMat = new THREE.MeshStandardMaterial({ color: 0xffe4b5 }); // Sand
            const alolaBase = new THREE.Mesh(alolaBaseGeo, alolaBaseMat);
            alolaBase.rotation.x = -Math.PI / 2;
            alolaBase.position.set(1000, 0.02, 0);
            alolaBase.receiveShadow = true;
            scene.add(alolaBase);
            createTallGrassZone(980, 1020, -20, 20, "Alola Region", ['Alolan Vulpix', 'Pidgey']);

            // --- GALAR REGION (Origin: -1000, 0, 0) ---
            const galarBaseGeo = new THREE.PlaneGeometry(100, 100);
            const galarBaseMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 }); // Sea green (misty)
            const galarBase = new THREE.Mesh(galarBaseGeo, galarBaseMat);
            galarBase.rotation.x = -Math.PI / 2;
            galarBase.position.set(-1000, 0.02, 0);
            galarBase.receiveShadow = true;
            scene.add(galarBase);
            createTallGrassZone(-1020, -980, -20, 20, "Galar Region", ['Galarian Slowpoke', 'Rattata']);

            // --- PORTALS ---
            createPortal(-20, 0, 30, 1000, 0, 30, 0xffaa00, "Alola Portal"); // Pallet to Alola
            createPortal(20, 0, 30, -1000, 0, 30, 0xaa00ff, "Galar Portal"); // Pallet to Galar
            
            // Return Portals
            createPortal(1000, 0, 40, 0, 0, 30, 0x00aaff, "Return to Kanto");
            createPortal(-1000, 0, 40, 0, 0, 30, 0x00aaff, "Return to Kanto");
        }

        function createTallGrassZone(xMin, xMax, zMin, zMax, regionName, encounterPool) {
            // Invisible bounding box for logic
            encounterZones.push({ xMin, xMax, zMin, zMax, regionName, encounterPool });

            // Visual instanced grass for performance
            const density = 0.5; 
            const count = Math.floor(Math.abs(xMax - xMin) * Math.abs(zMax - zMin) * density);
            
            const grassGeo = new THREE.BoxGeometry(0.2, 1.5, 0.2);
            // Slightly darker green than ground
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x228B22 }); 
            const instancedGrass = new THREE.InstancedMesh(grassGeo, grassMat, count);
            instancedGrass.castShadow = true;
            instancedGrass.receiveShadow = true;

            const dummy = new THREE.Object3D();
            for(let i=0; i < count; i++) {
                const x = xMin + Math.random() * (xMax - xMin);
                const z = zMin + Math.random() * (zMax - zMin);
                dummy.position.set(x, 0.75, z); // half height
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.updateMatrix();
                instancedGrass.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedGrass);
        }

        function createPortal(startX, startY, startZ, destX, destY, destZ, colorHex, name) {
            const portalGroup = new THREE.Group();
            portalGroup.position.set(startX, startY + 2, startZ);

            // Glowing Ring
            const ringGeo = new THREE.TorusGeometry(1.5, 0.2, 16, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            portalGroup.add(ring);

            // Point Light
            const light = new THREE.PointLight(colorHex, 2, 10);
            portalGroup.add(light);

            scene.add(portalGroup);
            
            portals.push({
                mesh: portalGroup,
                target: new THREE.Vector3(destX, destY, destZ),
                radius: 2.5
            });
        }

        ui.btnStart.addEventListener('click', () => {
            ui.start.style.display = 'none';
            controls.lock();
        });

        controls.addEventListener('lock', function () {
            if (currentState === GAME_STATES.INTRO) {
                ui.crosshair.style.display = 'block';
                showDialog("Prof. Oak: Welcome to the world of Pokémon! Choose a Poké Ball on the table to select your starter.");
            } else if (currentState === GAME_STATES.EXPLORATION) {
                ui.crosshair.style.display = 'block';
            }
        });

        controls.addEventListener('unlock', function () {
            ui.crosshair.style.display = 'none';
            if(currentState !== GAME_STATES.BATTLE) {
                ui.start.style.display = 'flex';
                ui.start.querySelector('h1').innerText = "PAUSED";
                ui.start.querySelector('p').innerHTML = "Click to resume your adventure.";
            }
        });

        // Event listeners for keyboard
        const onKeyDown = function (event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
            }
        };

        const onKeyUp = function (event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // Raycaster for clicking objects (Starter selection)
        const raycaster = new THREE.Raycaster();
        document.addEventListener('mousedown', (event) => {
            if (!controls.isLocked) return;
            if (currentState === GAME_STATES.INTRO) {
                // Raycast from center of screen
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(interactables);
                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit.userData && hit.userData.type === 'starter') {
                        selectStarter(hit.userData.pokemon);
                    }
